<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberMiner - Tap to Earn</title>
    <!-- TON Connect SDK for Wallet Connection -->
    <script src="https://unpkg.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: linear-gradient(135deg, #0f0c1b, #201335); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .header { width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .balance-container { text-align: center; margin-top: 10px; z-index: 10; }
        .balance-title { font-size: 14px; color: #8b80a7; text-transform: uppercase; letter-spacing: 2px; }
        .balance-amount { font-size: 42px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.6); margin-top: 5px; }
        .miner-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; z-index: 5; }
        .mining-core { width: 220px; height: 220px; background: radial-gradient(circle, #00ffcc, #0055ff); border-radius: 50%; box-shadow: 0 0 40px rgba(0, 255, 204, 0.8); cursor: pointer; transition: transform 0.05s ease; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        .mining-core:active { transform: scale(0.92); }
        .mining-core::after { content: "⚡"; font-size: 65px; }
        .airdrop-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; flex: 1; padding: 20px; text-align: center; z-index: 5; }
        .airdrop-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 15px; padding: 25px; width: 90%; max-width: 350px; }
        .claim-btn { background: linear-gradient(90deg, #00ffcc, #0055ff); color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; margin-top: 20px; width: 100%; cursor: pointer; }
        .claim-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }
        .footer { width: 100%; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; }
        .nav-item { text-align: center; color: #a0a0a0; cursor: pointer; font-size: 15px; padding: 10px 25px; border-radius: 10px; -webkit-tap-highlight-color: transparent; }
        .nav-item.active { color: #00ffcc; font-weight: bold; background: rgba(0, 255, 204, 0.1); }
        .float-text { position: absolute; color: #00ffcc; font-weight: bold; font-size: 28px; pointer-events: none; animation: floatUp 0.6s ease-out forwards; text-shadow: 0 0 8px rgba(0, 255, 204, 0.8); z-index: 100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-120px) scale(1.3); } }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight: bold; color: #00ffcc; font-size: 18px;">🤖 CyberMiner</div>
        <div id="ton-connect"></div>
    </div>
    <div class="balance-container">
        <div class="balance-title">Your $CYBER Balance</div>
        <div class="balance-amount" id="balance">0</div>
    </div>
    <div class="miner-container" id="tap-area">
        <div class="mining-core" id="mine-btn"></div>
    </div>
    <div class="airdrop-screen" id="airdrop-area">
        <div class="airdrop-card">
            <h2 style="color: #00ffcc; margin-bottom: 10px;">$CYBER Airdrop</h2>
            <p style="color: #a0a0a0; font-size: 14px; margin-bottom: 20px;">Connect your TON wallet and claim your tokens.</p>
            <div style="font-size: 14px; margin-bottom: 5px; color: #8b80a7;">Minimum Claim: 1000 Coins</div>
            <button class="claim-btn" id="claim-btn" disabled>Claim Tokens</button>
            <p id="claim-status" style="margin-top: 15px; font-size: 14px; color: #ffcc00;"></p>
        </div>
    </div>
    <div class="footer">
        <div class="nav-item active" id="btn-mine">⛏️ Mine</div>
        <div class="nav-item" id="btn-airdrop">🪙 Airdrop</div>
        </div>
        <script>
        // ১. আপনার রেন্ডার ব্যাকএন্ড লিংক (শেষে কোনো স্ল্যাশ দেবেন না)
        const BACKEND_URL = "https://cyberminer-backend.onrender.com"; 

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let telegramUserId = "Guest_" + Math.floor(Math.random() * 10000);
        let telegramUsername = "Anonymous";

        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                telegramUserId = tg.initDataUnsafe.user.id.toString();
                telegramUsername = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            }
        }

        let score = 0;
        const balanceDisplay = document.getElementById('balance');
        const mineBtn = document.getElementById('mine-btn');

        function loadPlayerProfile() {
            fetch(BACKEND_URL + "/api/player", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: telegramUserId, username: telegramUsername })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.balance !== undefined) {
                    score = data.balance;
                    balanceDisplay.innerText = score;
                }
            })
            .catch(function(err) { console.error("Load Error:", err); });
        }

        function sendTapsToBackend(tapsCount) {
            fetch(BACKEND_URL + "/api/player/tap", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: telegramUserId, taps: tapsCount })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.success) {
                    console.log("Coin Synced! Total:", data.balance);
                }
            })
            .catch(function(err) { console.error("Sync Error:", err); });
        }
        // ৫. টাচ স্ক্রিন রেসপন্সিভ ট্যাপ মেকানিজম (ফিক্সড)
        mineBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            let tapsThisSession = e.touches.length;
            score += tapsThisSession;
            balanceDisplay.innerText = score;
            
            sendTapsToBackend(tapsThisSession);

            // ট্যাপ করা আঙুলগুলোর পজিশনে +1 ইফেক্ট দেখানো
            const rect = document.getElementById('tap-area').getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                let clientX = e.touches[i].clientX;
                let clientY = e.touches[i].clientY;
                createFloatingText(clientX, clientY);
            }
        });

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'float-text';
            text.innerText = '+1';
            text.style.left = (x - 15) + 'px';
            text.style.top = (y - 30) + 'px';
            document.body.appendChild(text);
            setTimeout(function() { text.remove(); }, 600);
        }

        // ৬. নেভিগেশন ও স্ক্রিন পরিবর্তন লজিক
        const btnMine = document.getElementById('btn-mine');
        const btnAirdrop = document.getElementById('btn-airdrop');
        const tapArea = document.getElementById('tap-area');
        const airdropArea = document.getElementById('airdrop-area');

        btnMine.addEventListener('click', function() {
            btnMine.classList.add('active');
            btnAirdrop.classList.remove('active');
            tapArea.style.display = 'flex';
            airdropArea.style.display = 'none';
        });

        btnAirdrop.addEventListener('click', function() {
            btnAirdrop.classList.add('active');
            btnMine.classList.remove('active');
            tapArea.style.display = 'none';
            airdropArea.style.display = 'flex';
        });

        // 7. ওয়ালেট কানেকশন ও ক্লেইম সেটআপ
        const claimButton = document.getElementById('claim-btn');
        const claimStatusText = document.getElementById('claim-status');
        let userWalletAddress = "";

        const TON_CONNECT_UI = window.TonConnectUI;
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://githubusercontent.com',
            buttonRootId: 'ton-connect'
        });

        tonConnectUI.onStatusChange(function(wallet) {
            if (wallet) {
                userWalletAddress = wallet.account.address;
                claimButton.disabled = false;
            } else {
                userWalletAddress = "";
                claimButton.disabled = true;
            }
        });

        claimButton.addEventListener('click', function() {
            if (score < 1000) {
                claimStatusText.innerText = "❌ You need at least 1000 coins to claim!";
                return;
            }
            claimButton.disabled = true;
            claimStatusText.innerText = "⏳ Processing request...";

            fetch(BACKEND_URL + "/api/player/claim", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegramId: telegramUserId,
                    walletAddress: userWalletAddress,
                    amount: score
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    score = data.newBalance;
                    balanceDisplay.innerText = score;
                    claimStatusText.style.color = "#00ffcc";
                    claimStatusText.innerText = "✅ Success! Request submitted.";
                } else {
                    claimStatusText.innerText = "❌ Error: " + data.error;
                    claimButton.disabled = false;
                }
            })
            .catch(function(err) {
                claimStatusText.innerText = "❌ Server error, try again.";
                claimButton.disabled = false;
            });
        });

        loadPlayerProfile();
    </script>
</body>
</html>

    </div>
