<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMiner - Tap to Earn</title>
    <!-- TON Connect SDK for Wallet Connection -->
    <script src="https://unpkg.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0f0c1b, #201335);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #ton-connect-btn {
            scale: 0.9;
        }
        .balance-container {
            text-align: center;
            margin-top: 20px;
        }
        .balance-title {
            font-size: 14px;
            color: #8b80a7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin-top: 5px;
        }
        .miner-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }
        .mining-core {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #00ffcc, #0055ff);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mining-core:active {
            transform: scale(0.95);
        }
        .mining-core::after {
            content: "⚡";
            font-size: 60px;
        }
        .footer {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            text-align: center;
            color: #a0a0a0;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-item.active {
            color: #00ffcc;
            font-weight: bold;
        }
        .float-text {
            position: absolute;
            color: #00ffcc;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Top Header Layout -->
    <div class="header">
        <div style="font-weight: bold; color: #00ffcc;">🤖 CyberMiner</div>
        <!-- TON Wallet Connect Button Container -->
        <div id="ton-connect"></div>
    </div>

    <!-- Token Balance View -->
    <div class="balance-container">
        <div class="balance-title">Your $CYBER Balance</div>
        <div class="balance-amount" id="balance">0</div>
    </div>

    <!-- Interactive Tap Target -->
    <div class="miner-container" id="tap-area">
        <div class="mining-core" id="mine-btn"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="footer">
        <div class="nav-item active">⛏️ Mine</div>
        <div class="nav-item">👥 Tasks</div>
        <div class="nav-item">🎁 Frens</div>
        <div class="nav-item">🪙 Airdrop</div>
    </div>

    <script>
        // ১. আপনার রেন্ডার ব্যাকএন্ড লিংক (শেষে কোনো স্ল্যাশ দেবেন না)
        const BACKEND_URL = "https://cyberminer-backend.onrender.com"; 

        // ২. টেলিগ্রাম মিনি অ্যাপ ইনিশিয়েলাইজ করা
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let telegramUserId = "Guest_" + Math.floor(Math.random() * 10000);
        let telegramUsername = "Anonymous";

        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                telegramUserId = tg.initDataUnsafe.user.id.toString();
                telegramUsername = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            }
        }

        let score = 0;
        const balanceDisplay = document.getElementById('balance');
        const mineBtn = document.getElementById('mine-btn');

        // ৩. ডাটাবেজ থেকে প্লেয়ারের ব্যালেন্স লোড করা (ডাবল কোট ও + চিহ্ন দিয়ে ফিক্সড)
        function loadPlayerProfile() {
            fetch(BACKEND_URL + "/api/player", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: telegramUserId, username: telegramUsername })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.balance !== undefined) {
                    score = data.balance;
                    balanceDisplay.innerText = score;
                }
            })
            .catch(function(err) { console.error("Load Profile Error:", err); });
        }

        // ৪. প্রতিবার ট্যাপ করার পর ডাটাবেজে কয়েন সেভ করা (ডাবল কোট ও + চিহ্ন দিয়ে ফিক্সড)
        function sendTapsToBackend(tapsCount) {
            fetch(BACKEND_URL + "/api/player/tap", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: telegramUserId, taps: tapsCount })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.success) {
                    console.log("Coin Synced! Current Total:", data.balance);
                }
            })
            .catch(function(err) { console.error("Sync Coins Error:", err); });
        }

        // ৫. ট্যাপ মেকানিজম এবং মাল্টি-ট্যাপ অ্যানিমেশন
        mineBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            let tapsThisSession = e.touches.length;
            score += tapsThisSession;
            balanceDisplay.innerText = score;
            
            // ব্যাকএন্ডে ট্যাপ পাঠানো
            sendTapsToBackend(tapsThisSession);

            // ফ্লোটিং টেক্সট ইফেক্ট
            for (let i = 0; i < e.touches.length; i++) {
                createFloatingText(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'float-text';
            text.innerText = '+1';
            text.style.left = (x - 10) + 'px';
            text.style.top = (y - 20) + 'px';
            document.body.appendChild(text);
            setTimeout(function() { text.remove(); }, 800);
        }

        // ৬. ওয়ালেট কানেকশন সেটআপ
        const TON_CONNECT_UI = window.TonConnectUI;
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://githubusercontent.com',
            buttonRootId: 'ton-connect'
        });

        // গেম চালু হওয়ার সাথে সাথে প্রোফাইল লোড করা
        loadPlayerProfile();
    </script>
</body>
</html>
